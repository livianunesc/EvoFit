# Projeto separado: não reutiliza nem remove o banco da edição PHP anterior.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: evofit_academico
      MYSQL_USER: evofit
      MYSQL_PASSWORD: ${ACADEMIC_DB_PASSWORD:?Execute python tools/preparar_academico.py primeiro}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - academic_mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -e "SELECT 1" "$$MYSQL_DATABASE" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
  app:
    image: evofit-academico:dev
    build:
      context: .
      dockerfile: Dockerfile.academico
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: evofit_academico
      DB_USER: evofit
      DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:?Execute a preparação primeiro}
      EVOFIT_STATE_DIR: /estado
    volumes:
      - .:/app
      - academic_state:/estado
    ports:
      - '127.0.0.1:4173:4173'
    depends_on:
      db:
        condition: service_healthy
volumes:
  academic_mysql:
  academic_state:
